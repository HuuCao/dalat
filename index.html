<!DOCTYPE html>

  <title>Đà Lạt Trip Plan</title>
  <!-- Tab icon: SVG where supported, PNG otherwise. Home screen: iOS takes
       apple-touch-icon (opaque, it rounds the corners itself); Android takes
       the manifest. Opened from the home screen the page runs as its own app. -->
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Đà Lạt">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/tabs.css">
  <link rel="stylesheet" href="css/timeline.css">
  <link rel="stylesheet" href="css/countdown.css">
  <link rel="stylesheet" href="css/fund.css">
  <link rel="stylesheet" href="css/motion/keyframes.css">
  <link rel="stylesheet" href="css/motion/load.css">
  <link rel="stylesheet" href="css/motion/scroll-timeline.css">
  <link rel="stylesheet" href="css/motion/reveal.css">
  <script type="module" src="js/main.js"></script>
  <!-- Picks the animation layer before the first paint; keep it last in <head>. -->
  <script>
    if (!(window.CSS && CSS.supports && CSS.supports('animation-timeline', 'view()'))) {
      document.documentElement.classList.add('no-scroll-timeline');
    }
  </script>
</head>

<body>
  <div class="progress" aria-hidden="true"></div>
  <div id="app"></div>
  <noscript>
    <p class="noscript">Trang cần JavaScript. Hãy mở link https://huucao.github.io/dalat/ bằng trình duyệt.</p>
  </noscript>
</body>

</html>
